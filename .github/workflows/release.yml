name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact_name: TenantManager-Windows-x64
            is_mac: false
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: TenantManager-Linux-x64
            is_mac: false
          - os: macos-latest
            runtime: osx-x64
            artifact_name: TenantManager-macOS-Intel
            is_mac: true
          - os: macos-latest
            runtime: osx-arm64
            artifact_name: TenantManager-macOS-ARM64
            is_mac: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Ensure .NET 10 is used

      - name: Publish (Windows / Linux)
        if: ${{ !matrix.is_mac }}
        run: |
          dotnet publish src/TenantManager.App/TenantManager.App.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.runtime }}
          
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path publish\${{ matrix.runtime }}\* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd publish/${{ matrix.runtime }}
          tar -czvf ../../${{ matrix.artifact_name }}.tar.gz *
          cd ../..

      - name: Build and Package macOS
        if: ${{ matrix.is_mac }}
        run: |
          chmod +x bundle-mac.sh
          ./bundle-mac.sh Release ${{ matrix.runtime }}
          mv dist/TenantManager-${{ matrix.runtime }}.zip ${{ matrix.artifact_name }}.zip

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

      - name: Upload Artifacts (macOS)
        if: ${{ matrix.is_mac }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
